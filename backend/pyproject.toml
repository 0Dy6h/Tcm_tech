[project]
name = "qiyan-nexus-backend"
version = "0.1.0"
description = "FastAPI backend for Qiyan Nexus"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.136.3",
    "httpx>=0.27.0",
    "numpy>=1.26,<3",
    "pydantic>=2.6,<3",
    "pypdf>=6.16.1",
    "pytest>=8.0.0",
    "python-multipart>=0.0.31",
    "scipy>=1.11.0",
    "slowapi>=0.1.9",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=3.0.0",
    "transformers>=5.10.4",
    "pytest-cov>=5.0.0",
]
postgresql = [
    "psycopg[binary,pool]>=3.1.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["app"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "psycopg_pool", "scipy", "scipy.*", "slowapi", "slowapi.*"]
ignore_missing_imports = true
